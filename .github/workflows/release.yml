name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build CLI and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: go test -count=1 ./...
      - name: Cross-compile
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="aibouncer_${GITHUB_REF_NAME}_${os}_${arch}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "build/$name/aibouncer$ext" ./cmd/aibouncer
            cp LICENSE README.md "build/$name/"
            if [ "$os" = "windows" ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Ask the Go module proxy to fetch this version (indexes it on pkg.go.dev)
        run: curl -sSf "https://proxy.golang.org/github.com/emorilebo/aibouncer/@v/${GITHUB_REF_NAME}.info"
