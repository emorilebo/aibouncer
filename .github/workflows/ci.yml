name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.22", "stable"]
        include:
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            go test -race -count=1 ./...
          else
            go test -count=1 ./...
          fi

  lint:
    name: Lint and vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Analysis tools can lag a new Go release by a few weeks; oldstable is always supported.
          go-version: oldstable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: robots.txt parser
        run: go test -run='^$' -fuzz=FuzzParseAndCheck -fuzztime=45s ./robotstxt/
      - name: Web Bot Auth verifier
        run: go test -run='^$' -fuzz=FuzzVerifyDoesNotPanic -fuzztime=45s ./webbotauth/
